# Projet Xcode généré par XcodeGen : `xcodegen generate` (voir ios/README.md).
# Le fichier .xcodeproj n'est pas versionné : cette description fait foi.
name: RestaurantPOS
options:
  bundleIdPrefix: com.restaurantpos
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  POSKit:
    path: POSKit

targets:
  RestaurantPOS:
    type: application
    platform: iOS
    sources:
      - path: POSApp
    dependencies:
      - package: POSKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restaurantpos.ipad
        PRODUCT_NAME: RestaurantPOS
        INFOPLIST_FILE: POSApp/Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES

  RestaurantPOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: POSAppUITests
    dependencies:
      - target: RestaurantPOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restaurantpos.ipad.uitests
        TEST_TARGET_NAME: RestaurantPOS
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic

schemes:
  RestaurantPOS:
    build:
      targets:
        RestaurantPOS: all
        RestaurantPOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - RestaurantPOS
      targets:
        - name: RestaurantPOSUITests
          parallelizable: false

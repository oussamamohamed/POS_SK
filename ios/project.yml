# Projet Xcode généré par XcodeGen : `cd ios && xcodegen generate`
# Le .xcodeproj n'est pas versionné ; ce fichier est la source de vérité.
name: RestaurantPOS
options:
  bundleIdPrefix: com.restaurantpos
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: fr
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  PosKit:
    path: Packages/PosKit

targets:
  RestaurantPOS:
    type: application
    platform: iOS
    sources:
      - path: RestaurantPOS
    dependencies:
      - package: PosKit
    info:
      path: RestaurantPOS/Info.plist
      properties:
        CFBundleDisplayName: Restaurant POS
        CFBundleDevelopmentRegion: fr
        UILaunchScreen:
          UIColorName: ""
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSLocalNetworkUsageDescription: La caisse communique avec le serveur de caisse, les imprimantes et les écrans cuisine du réseau local.
        NSBonjourServices:
          - _restaurantpos._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restaurantpos.ipad
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

  RestaurantPOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RestaurantPOSUITests
    dependencies:
      - target: RestaurantPOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.restaurantpos.ipad.uitests
        TARGETED_DEVICE_FAMILY: "2"
        TEST_TARGET_NAME: RestaurantPOS
        GENERATE_INFOPLIST_FILE: YES

schemes:
  RestaurantPOS:
    build:
      targets:
        RestaurantPOS: all
        RestaurantPOSUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - RestaurantPOS
        - package: PosKit/PosKit
      targets:
        - name: RestaurantPOSUITests
          parallelizable: false
        - package: PosKit/PosKitTests
